<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Festiverse app — геймификация в приложении для фестивалей</title>
  <style>
    @font-face { font-family: 'Geist'; src: url('Geist/static/Geist-Light.ttf') format('truetype'); font-style: normal; font-weight: 300; font-display: swap; }
    @font-face { font-family: 'Geist'; src: url('Geist/static/Geist-Regular.ttf') format('truetype'); font-style: normal; font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Geist'; src: url('Geist/static/Geist-Medium.ttf') format('truetype'); font-style: normal; font-weight: 500; font-display: swap; }
    @font-face { font-family: 'Geist'; src: url('Geist/static/Geist-SemiBold.ttf') format('truetype'); font-style: normal; font-weight: 600; font-display: swap; }
    @font-face { font-family: 'Geist'; src: url('Geist/static/Geist-Bold.ttf') format('truetype'); font-style: normal; font-weight: 700; font-display: swap; }
    @font-face { font-family: 'Geist Mono'; src: url('Geist_Mono/static/GeistMono-Regular.ttf') format('truetype'); font-style: normal; font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Geist Mono'; src: url('Geist_Mono/static/GeistMono-SemiBold.ttf') format('truetype'); font-style: normal; font-weight: 600; font-display: swap; }
    :root {
      --bg: #F3F3F3;
      --paper: #ffffff;
      --ink: #111111;
      --muted: #4b4b4b;
      --line: #e8e8e8;
      --link: #2563eb;
      --link-hover: #1d4ed8;
      --font-mono: 'Geist Mono', 'SFMono-Regular', Menlo, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    

    * { box-sizing: border-box; letter-spacing: 0; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Geist', sans-serif;
      background: linear-gradient(180deg, #B4C0D8 0px, #F3F3F3 180px), #F3F3F3;
      background-repeat: no-repeat;
      color: var(--ink);
      line-height: 1.7;
      cursor: auto;
    }

    a { color: var(--link); text-decoration: none; transition: color 0.3s, border-color 0.3s; }
    a:hover { color: var(--link-hover); }
    img { max-width: 100%; display: block; }
    em { font-style: normal; }

    .case-page {
      width: 1440px;
      max-width: 100%;
      margin-inline: auto;
      padding: 80px 320px;
      align-self: stretch;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 60px;
    }
    @media (max-width: 1380px) {
      .case-page {
        padding: clamp(48px, 5vw, 80px) clamp(48px, 6vw, 320px);
        gap: clamp(40px, 4vw, 60px);
      }
    }
    @media (max-width: 1180px) {
      .case-page {
        padding: clamp(40px, 4vw, 72px) clamp(32px, 4vw, 240px);
        gap: clamp(32px, 3vw, 48px);
      }
    }
    @media (max-width: 820px) {
      .case-page {
        padding: clamp(32px, 3vw, 60px) clamp(24px, 3vw, 160px);
        gap: clamp(24px, 2vw, 40px);
      }
    }
    @media (max-width: 640px) {
      .case-page {
        padding: clamp(24px, 2vw, 48px) clamp(16px, 2vw, 80px);
        gap: clamp(20px, 2vw, 32px);
      }
    }

    .case-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 64px;
      padding-bottom: 20px;
    }
    /* Кнопки в стиле главной страницы */
    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 56px;
      padding: 16px 32px;
      border-radius: 58px;
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      transition: background .25s var(--ease), transform .25s var(--ease);
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .btn-ghost { background: #fff; color: var(--ink); }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.5); color: var(--ink); }

    .case-header { margin-bottom: 0px; }

    h1 {
      margin: 0;
      font-family: 'Geist Mono', 'SFMono-Regular', Menlo, monospace;
      font-size: clamp(40px, 7vw, 70px);
      line-height: 0.96;
      letter-spacing: 0;
      font-weight: 400;
    }

    .case-subtitle {
      margin-top: 36px;
      max-width: 700px;
      font-size: 16px;
      line-height: 1.6;
      color: var(--muted);
    }

    .case-section { margin-top: 72px; }

    h2 {
      margin: 0 0 18px;
      font-family: 'Geist Mono', 'SFMono-Regular', Menlo, monospace;
      font-size: clamp(20px, 3.5vw, 28px);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p, li {
      margin: 0 0 16px;
      font-size: 16px;
      line-height: 1.75;
      color: var(--muted);
    }

    ul { margin: 0 0 0 18px; padding: 0; }

    .case-image {
      width: 100%;
      margin: 40px 0 24px;
      border-radius: 10px;
      background: var(--paper);
    }

    .case-back,
    .case-back-link {
      margin-top: 28px;
    }

    @media (max-width: 640px) {
      .case-page { padding-top: 48px; }
      .case-topbar { margin-bottom: 36px; }
      .case-subtitle { font-size: 16px; }
    }
    a:visited { color: var(--link); }
    a:visited:hover { color: var(--link-hover); }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    .btn:visited,
    .btn:hover,
    .btn:visited:hover { color: var(--ink); }
        /* ============ ПЛАВНЫЙ ПЕРЕХОД СТРАНИЦ ============ */
    body {
      opacity: 0;
      translate: 0 12px;
      transition: opacity 0.5s ease-out, translate 0.5s ease-out;
    }
    body.loaded {
      opacity: 1;
      translate: 0 0;
    }
    body.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Иконки внутри кнопок (если ещё не заданы) */
    .btn-icon { 
      width: 20px; 
      height: 20px; 
      flex: none; 
      object-fit: contain; 
    }

    @media (prefers-reduced-motion: reduce) {
      body { transition: none; }
    }
  </style>
</head>
<body>
  <main class="case-page">
    <header class="case-topbar">
            <a class="case-back btn btn-ghost" href="index.html">
          <img src="icons/Property 1=ArrowLeft.svg" alt="" aria-hidden="true" class="btn-icon" />
          <span>Назад</span>
       </a>
    </header>

    <header class="case-header">
      <h1>Festiverse app</h1>
      <p class="case-subtitle">Геймификация в приложении для фестивалей.</p>
    </header>

    <article>
      <section class="case-section">
        <h2>Кейс в процессе</h2>
        <p>Описание и подробности дизайн-процесса пока что в работе.</p>
      </section>

      <section class="case-section">
        <!-- <h2>Превью</h2>

        <!-- ============================================================
             ШАБЛОН ДЛЯ КАРТИНОК
             Добавьте столько <img>, сколько нужно. Класс case-image
             уже даёт скругление 10px, белый фон и отступы.
             Формат пути: папка кейса / имя файла.
             Пример:
             <img src="festiverse/festiverse-1.png" alt="Экран квеста" class="case-image">
             ============================================================ -->

        
        <img src="festiverse/festiverse - old overview screen.png" alt="Экран приложения Festiverse" class="case-image">
        <img src="festiverse/festiverse - new overview.png" alt="Экран приложения Festiverse" class="case-image">
        <img src="festiverse/festiverse - leaderboard comparing.png" alt="Экран приложения Festiverse" class="case-image">
        <img src="festiverse/festiverse - add friend.png" alt="Экран приложения Festiverse" class="case-image">
        <img src="festiverse/festiverse - generate qr code.png" alt="Экран приложения Festiverse" class="case-image">
        <img src="festiverse/festiverse - profile.png" alt="Экран приложения Festiverse" class="case-image">
        <img src="festiverse/festiverse - edit profile.png" alt="Экран приложения Festiverse" class="case-image">



        <!-- Дублируйте строку ниже для остальных картинок:
        <img src="festiverse/festiverse-4.png" alt="Экран приложения Festiverse" class="case-image">
        <img src="festiverse/festiverse-5.png" alt="Экран приложения Festiverse" class="case-image">
        <img src="festiverse/festiverse-6.png" alt="Экран приложения Festiverse" class="case-image">
        -->

      </section>

            <a class="case-back-link btn btn-ghost" href="index.html">
            <img src="icons/Property 1=ArrowLeft.svg" alt="" aria-hidden="true" class="btn-icon" />
            <span>К портфолио</span>
            </a>
    </article>
  </main>
    <script>
    // ===== ПЛАВНЫЙ ПЕРЕХОД СТРАНИЦ =====
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => document.body.classList.add('loaded'), 50);
    });

    document.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (!link) return;

      const href = link.getAttribute('href');
      const target = link.getAttribute('target');

      if (
        !href ||
        href.startsWith('#') ||
        href.startsWith('http') ||
        href.startsWith('mailto') ||
        href.startsWith('tel') ||
        href.endsWith('.pdf') ||
        target === '_blank'
      ) return;

      e.preventDefault();
      document.body.classList.add('fade-out');
      setTimeout(() => window.location.href = href, 500);
    });
  </script>
</body>
</html>
